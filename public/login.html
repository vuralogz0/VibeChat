
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giriş Yap | VibeChat</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  font-family: Arial, sans-serif;
  color: white;
  background:
    linear-gradient(135deg,rgba(8,7,30,.65),rgba(25,8,50,.85)),
    url("/a_stunning_night_landscape_a_realistic_cinematic.png")
    center / cover fixed;
}

.card {
  width: 100%;
  max-width: 420px;
  padding: 32px;
  background: rgba(15,12,40,.85);
  border: 1px solid #a855f766;
  border-radius: 24px;
  box-shadow: 0 20px 60px #0008;
  backdrop-filter: blur(15px);
}

h1 { text-align: center; margin: 0 0 10px; }
h1 span { color: #c084fc; }

.subtitle {
  text-align: center;
  color: #ddd6fe;
}

label {
  display: block;
  margin: 18px 0 8px;
}

input {
  width: 100%;
  padding: 14px;
  background: #17142e;
  border: 1px solid #7654a3;
  border-radius: 12px;
  color: white;
  font-size: 15px;
}

button {
  width: 100%;
  margin-top: 24px;
  padding: 15px;
  border: 0;
  border-radius: 12px;
  background: linear-gradient(120deg,#9333ea,#6d28d9);
  color: white;
  font-weight: bold;
  font-size: 16px;
  cursor: pointer;
}

button:disabled {
  opacity: .6;
  cursor: wait;
}

a { color: #d8b4fe; }

.bottom {
  text-align: center;
  margin-top: 22px;
}

#message {
  margin-top: 15px;
  text-align: center;
  color: #f0abfc;
}
</style>
</head>
<body>

<div class="card">
  <h1>Vibe<span>Chat</span> ✨</h1>
  <p class="subtitle">Hesabına giriş yap</p>

  <form id="loginForm">
    <label for="email">E-posta</label>
    <input id="email" type="email"
           autocomplete="email" required>

    <label for="password">Şifre</label>
    <input id="password" type="password"
           autocomplete="current-password" required>

    <button id="loginBtn" type="submit">
      Giriş Yap
    </button>
  </form>

  <p id="message" role="status"></p>

  <p class="bottom">
    Hesabın yok mu?
    <a href="/signup.html">Hesap Oluştur</a>
  </p>

  <p class="bottom">
    <a href="/">Ana sayfaya dön</a>
  </p>
</div>

<script type="module">
import { createClient } from
  "https://esm.sh/@supabase/supabase-js@2";

const supabase = createClient(
  "https://orznejzevoclmjqfulzh.supabase.co",
  "sb_publishable_GnGvKSlRTKL_PUzUAJtatw_uFg2GeP4"
);

const form = document.getElementById("loginForm");
const message = document.getElementById("message");
const button = document.getElementById("loginBtn");

form.addEventListener("submit", async (event) => {
  event.preventDefault();

  button.disabled = true;
  message.textContent = "Giriş yapılıyor...";

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  try {
    const { data, error } =
      await supabase.auth.signInWithPassword({
        email,
        password
      });

    if (error) throw error;

    if (data.user) {
      message.textContent = "Giriş başarılı!";
      window.location.href = "/";
    }
  } catch (error) {
    message.textContent =
      "Giriş yapılamadı. E-posta ve şifreni kontrol et.";
    console.error(error);
  } finally {
    button.disabled = false;
  }
});
</script>

</body>
</html>
